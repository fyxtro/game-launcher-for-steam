name: Release

# Builds the plugin and publishes a GitHub release with the installable
# .streamDeckPlugin attached. Run it from the Actions tab ("Run workflow"),
# or push a tag like v1.2.1. The version comes from package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and pack
        run: npm run pack

      - name: Validate
        run: npx streamdeck validate tools.quin.steamlibrary.sdPlugin

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/tools.quin.steamlibrary.streamDeckPlugin
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
